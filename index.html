<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>PhishLab — Biblioteca de plantillas para campañas autorizadas</title>
<link rel="stylesheet" href="assets/css/app.css">
</head>
<body>

<header class="barra">
  <a class="marca-app" href="#/biblioteca">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <path d="M12 2 4 5.5v6c0 4.6 3.2 8.7 8 10.5 4.8-1.8 8-5.9 8-10.5v-6L12 2Z"
            fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      <path d="m8.8 12 2.3 2.3 4.3-4.6" fill="none" stroke="currentColor"
            stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <span>PhishLab</span>
  </a>

  <span class="etiqueta-uso" id="etiqueta-uso">Uso interno · campañas autorizadas</span>

  <nav class="navegacion" id="navegacion">
    <a class="nav-enlace" href="#/biblioteca" data-vista="biblioteca">Biblioteca</a>
    <a class="nav-enlace" href="#/campana" data-vista="campana">Campaña</a>
    <a class="nav-enlace" href="#/importar" data-vista="importar">Importar</a>
    <a class="nav-enlace" href="#/senales" data-vista="senales">Señales</a>
  </nav>

  <div class="acciones-barra" id="acciones-barra"></div>
</header>

<div id="cinta-demo" hidden class="cinta-demo">
  Demo pública de solo lectura. Todas las marcas son inventadas, la exportación
  y la importación están desactivadas.
</div>

<main id="vista-principal">
  <div class="cargando">Cargando catálogo…</div>
</main>

<div id="brindis" class="brindis" role="status" aria-live="polite"></div>

<script type="module" src="assets/js/app.js"></script>
</body>
</html>
