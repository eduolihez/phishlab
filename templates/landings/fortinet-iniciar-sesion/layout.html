            body {
                font-family: Helvetica, sans-serif;
                font-size: 13px;
                overflow: auto;
                -webkit-font-smoothing: antialiased;
            }

            .body-wrapper {
                margin: 0 auto;
                padding-inline: var(--padding-inline);
                overflow: auto;
                min-height: calc(100% - 20px);

                display: flex;
                flex-direction: column;
                gap: 30px;
                justify-content: space-between;
            }

            .content-container {
                display: flex;
                justify-content: space-between;
            }

            .main-content {
                width: calc(max(720px, 37.5vmax));
                display: flex;
                flex-direction: column;

                background-color: rgba(255, 255, 255, 0.95);
                padding: 0;
                box-shadow: 0 0 20px 0 rgba(0, 0, 0, 0.05),
                    0 5px 5px 0 rgba(0, 0, 0, 0.05);
            }

            .logo-top,
            .logo-footer {
                width: auto;
                background-repeat: no-repeat;
            }

            .footer-row {
                display: flex;
                align-items: center;
                justify-content: space-between;
                padding-bottom: 30px;
            }

            .bar {
                display: inline-block;
                width: 5px;
                height: 24px;
                margin-bottom: 0;
                background-color: #d92919;
            }

            .title-container:not(.security-screen) {
                display: flex;
                gap: 7px;
                margin-bottom: 30px;
            }

            .side-info {
                min-width: 350px;
                max-width: 485px;
            }

            .side-info .text-container {
                background-color: rgba(245, 247, 246, 0.7);
                padding: 15px 30px 15px 0;
            }

            .side-info .big-text {
                font-size: clamp(1rem, 2vw + 0.25rem, 2.2rem);
                line-height: 130%;
                letter-spacing: 0.0125em;
            }

            .side-info .highlight {
                font-weight: bold;
            }

            .dec-bar {
                height: 0.5vw;
                background: var(--accent-fortinet);
                width: 150px;
                margin-block: 30px;
            }

            .side-info .deck {
                font-size: clamp(0.9rem, 1vw + 0.25rem, 1.15rem);
                line-height: 130%;
            }

            .main-body {
                flex-grow: 1;
                display: flex;
                flex-direction: column;
                justify-content: center;
            }

            .content-wrapper {
                padding: 60px 4.5vw 5vw;
            }

            .content-wrapper.security {
                --padding-form: 40px;
            }

            .content-wrapper.security .tab-container.security-row a.tab {
                --padding-form: 40px;
            }

            .form-container-narrow {
                margin: 0 auto 25px;
                padding-bottom: 15px;
            }

            h1 {
                color: white;
                font-weight: 700;
                font-size: 21px;
            }

            h2 {
                color: black;
