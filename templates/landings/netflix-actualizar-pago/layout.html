<!doctype html>
<html lang="{{idioma}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{tituloPagina}}</title>
<style>
  /* Recreación de la pantalla de reautenticación de Netflix antes de tocar
     el método de pago. Escrita a mano, no un volcado del sitio real. */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: Helvetica, Arial, sans-serif;
    font-size: 15px;
    color: #ffffff;
    background: #000000;
  }

  .envoltorio { width: 100%; max-width: 440px; }

  .marca-tenant { margin-bottom: 18px; min-height: 24px; text-align: center; }
  .marca-tenant img { max-width: 150px; max-height: 42px; display: block; margin: 0 auto; }

  .marca-nf { text-align: center; margin-bottom: 30px; }
  .marca-nf span { font-size: 30px; font-weight: 800; letter-spacing: -.5px; color: #e50914; }

  .tarjeta { padding: 0 8px; }

  h1 { margin: 0 0 10px; font-size: 25px; font-weight: 700; text-align: center; }
  .subtitulo { margin: 0 0 26px; font-size: 15px; color: #b3b3b3; text-align: center; line-height: 22px; }

  .aviso {
    margin: 0 0 20px;
    font-size: 13px;
    line-height: 19px;
    color: #ffb15c;
    background: #2a1f10;
    padding: 12px 14px;
    border-radius: 4px;
  }
  .aviso:empty { display: none; padding: 0; margin: 0; }

  .grupo-campo { margin-bottom: 16px; position: relative; }
  .campo {
    width: 100%;
    padding: 16px 14px 6px;
    font-family: inherit;
    font-size: 16px;
    color: #ffffff;
    background: #333333;
    border: 1px solid #8c8c8c;
    border-radius: 4px;
    outline: none;
  }
  .campo:focus { border-color: #ffffff; }
  .campo::placeholder { color: #8c8c8c; }

  .error { margin: 6px 0 0; font-size: 13px; color: #e87c03; }
  .error:empty { display: none; }

  .boton {
    width: 100%;
    padding: 15px;
    font-family: inherit;
    font-size: 16px;
    font-weight: 700;
    color: #ffffff;
    background: #e50914;
    border: 0;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 6px;
  }
  .boton:hover { background: #c11119; }

  .enlaces { text-align: center; margin-top: 18px; font-size: 13.5px; color: #b3b3b3; }
  .enlaces a { color: #ffffff; text-decoration: none; }
  .enlaces a:hover { text-decoration: underline; }

  .pie {
    display: flex;
    justify-content: center;
    gap: 18px;
    margin-top: 28px;
    font-size: 12px;
    color: #737373;
  }
  .pie a { color: #737373; text-decoration: none; }
</style>
</head>
<body>

<div class="envoltorio">
  <div class="marca-tenant">{{logoHtml}}</div>
  <!--@bloque:marca @opcional-->
  <div class="marca-nf" aria-hidden="true"><svg style="display:block;height:28px;width:auto" xmlns="http://www.w3.org/2000/svg" width="1024" height="276.742" viewBox="0 0 1024 276.742"><path d="M140.803 258.904c-15.404 2.705-31.079 3.516-47.294 5.676l-49.458-144.856v151.073c-15.404 1.621-29.457 3.783-44.051 5.945v-276.742h41.08l56.212 157.021v-157.021h43.511v258.904zm85.131-157.558c16.757 0 42.431-.811 57.835-.811v43.24c-19.189 0-41.619 0-57.835.811v64.322c25.405-1.621 50.809-3.785 76.482-4.596v41.617l-119.724 9.461v-255.39h119.724v43.241h-76.482v58.105zm237.284-58.104h-44.862v198.908c-14.594 0-29.188 0-43.239.539v-199.447h-44.862v-43.242h132.965l-.002 43.242zm70.266 55.132h59.187v43.24h-59.187v98.104h-42.433v-239.718h120.808v43.241h-78.375v55.133zm148.641 103.507c24.594.539 49.456 2.434 73.51 3.783v42.701c-38.646-2.434-77.293-4.863-116.75-5.676v-242.689h43.24v201.881zm109.994 49.457c13.783.812 28.377 1.623 42.43 3.242v-254.58h-42.43v251.338zm231.881-251.338l-54.863 131.615 54.863 145.127c-16.217-2.162-32.432-5.135-48.648-7.838l-31.078-79.994-31.617 73.51c-15.678-2.705-30.812-3.516-46.484-5.678l55.672-126.75-50.269-129.992h46.482l28.377 72.699 30.27-72.699h47.295z" fill="#d81f26"/></svg>
</div>
  <!--@/bloque-->

  <div class="tarjeta">
    <h1>{{tituloPagina}}</h1>
    <p class="subtitulo">{{subtitulo}}</p>

    <!--@bloque:aviso-pago @senal:urgencia-->
    <p class="aviso">{{aviso}}</p>
    <!--@/bloque-->

    <!--
      Campos "email"/"password" exactos: es como GoPhish sabe cuál descartar
      cuando "Capture Passwords" está desmarcada en la campaña. La cuenta ya
      "sabe" el correo (como en el flujo real), así que aquí solo se
      reintroduce la contraseña.
    -->
    <form method="post" action="" autocomplete="off">
      <input type="hidden" name="email" value="{{cuentaEmail}}">
      <div class="grupo-campo">
        <input class="campo" type="password" id="password" name="password" placeholder="{{phPassword}}" required autofocus>
        <p class="error" id="error-password" hidden>{{errorPassword}}</p>
      </div>
      <button class="boton" type="submit">{{btnContinuar}}</button>
    </form>

    <div class="enlaces"><a href="#">{{enlaceOlvido}}</a></div>
  </div>

  <!--@bloque:pie-legal @senal:!incoherencia-marca-->
  <div class="pie">
    <a href="https://help.netflix.com" target="_blank" rel="noopener">{{enlaceAyuda}}</a>
    <a href="https://help.netflix.com/legal/privacy" target="_blank" rel="noopener">{{enlacePrivacidad}}</a>
    <a href="https://help.netflix.com/legal/termsofuse" target="_blank" rel="noopener">{{enlaceCondiciones}}</a>
  </div>
  <!--@/bloque-->
</div>

</body>
</html>
